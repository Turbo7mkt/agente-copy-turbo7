<style>

   Tokens iguais aos de docs/painel-artifact.html e base-conhecimento/regras/identidade-turbo7.md. */
:root {
  --azul: #6D28D9; --azul-vivo: #7C3AED; --magenta: #A21CAF;
  --pessego: #F7D9FB; --pessego-ink: #86198F;

  --line: #E5DCF4; --line-forte: #CBBAE8;
  --ink: #17102A; --ink-suave: #453763; --ink-fraco: #75678F;
  --ok: #16704a; --ok-bg: #e4f4ec;
  --erro: #a52017; --erro-bg: #fbe9e7;
  --alerta: #8a5a00; --alerta-bg: #fdf1dc;
  --f0: #EDE6F7; --f1: #E3D5F6; --f2: #CDB4F2; --f3: #A97DEB; --f4: #7C3AED;
  --display: "Poppins", "Trebuchet MS", sans-serif;
  --corpo: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --azul: #C4A5F7; --azul-vivo: #DCC4FF; --magenta: #F0ABFC;
    --pessego: #3A1F45; --pessego-ink: #F0ABFC;
    --ground: #110A1F; --surface: #1B1230; --surface-alt: #261841;
    --line: #38265C; --line-forte: #503A7C;
    --ink: #F0E9FA; --ink-suave: #C6B8DC; --ink-fraco: #9A8AB4;
    --ok: #5cc496; --ok-bg: #14301f; --erro: #f08b83; --erro-bg: #35191a;
    --alerta: #e0a34a; --alerta-bg: #2e2413;
    --f0: #2A1D44; --f1: #37255A; --f2: #523782; --f3: #7B55B8; --f4: #B48BF2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --azul: #C4A5F7; --azul-vivo: #DCC4FF; --magenta: #F0ABFC;
  --pessego: #3A1F45; --pessego-ink: #F0ABFC;
  --ground: #110A1F; --surface: #1B1230; --surface-alt: #261841;
  --line: #38265C; --line-forte: #503A7C;
  --ink: #F0E9FA; --ink-suave: #C6B8DC; --ink-fraco: #9A8AB4;
  --ok: #5cc496; --ok-bg: #14301f; --erro: #f08b83; --erro-bg: #35191a;
  --alerta: #e0a34a; --alerta-bg: #2e2413;
  --f0: #2A1D44; --f1: #37255A; --f2: #523782; --f3: #7B55B8; --f4: #B48BF2;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

}

/* Topo: gradiente da assinatura, uma vez por tela */

.cab-funcao { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.cab-funcao h1 { font-size: 1.45rem; font-weight: 600; }
.cab-funcao .sub { color: var(--ink-fraco); font-size: 0.88rem; max-width: 62ch; }
.pessoas { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); overflow: hidden; }
.bloco-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line); }

table.ct { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 760px; }
table.ct th { text-align: left; font-weight: 600; font-size: 0.7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-fraco); padding: 8px 10px; background: var(--surface-alt); white-space: nowrap; }

.ind-nome { font-weight: 600; line-height: 1.3; }

.tag { display: inline-block; font-family: var(--mono); font-size: 0.66rem; padding: 1px 6px; border-radius: 5px; background: var(--surface-alt); color: var(--ink-suave); border: 1px solid var(--line); margin-left: 4px; vertical-align: 1px; }

input.cel { width: 88px; padding: 5px 7px; border: 1px solid var(--line-forte); border-radius: 7px; background: var(--surface); text-align: right; font-family: var(--mono); font-size: 0.82rem; }
input.cel:focus { border-color: var(--azul); }

.prog { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.barra { width: 64px; height: 6px; background: var(--f0); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
.barra i { display: block; height: 100%; background: var(--azul); border-radius: 3px; }
.barra i.cheio { background: var(--ok); }
.pts { font-family: var(--mono); font-weight: 600; }

.sim-cel { display: flex; align-items: center; gap: 10px; min-width: 250px; }

.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line-forte); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--ink-suave); }
.btn:hover { border-color: var(--azul); color: var(--azul); }
.btn.forte { background: var(--azul); border-color: var(--azul); color: var(--surface); }

/* Placar */
.placar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); padding: 18px; }
.placar.sim { border-color: var(--azul); box-shadow: inset 0 0 0 1px var(--azul); }
.rotulo { font-size: 0.7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-fraco); font-weight: 600; }
.nota-grande { display: flex; align-items: baseline; gap: 8px; }
.nota-grande .n { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.nota-grande .de { color: var(--ink-fraco); font-family: var(--mono); font-size: 0.9rem; }
.bonus { font-family: var(--display); font-weight: 600; font-size: 1.35rem; color: var(--azul); }
.regua { position: relative; padding-top: 16px; }
.faixas { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
.faixas span { display: block; height: 100%; }
.marcador { position: absolute; top: 0; width: 2px; height: 30px; background: var(--ink); transform: translateX(-1px); transition: left .25s ease; }
.marcador::before { content: ""; position: absolute; top: -2px; left: -4px; border: 5px solid transparent; border-top-color: var(--ink); }
.regua-rot { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.66rem; color: var(--ink-fraco); margin-top: 5px; }
.meses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mes { background: var(--surface-alt); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; }
.mes .m { font-size: 0.7rem; color: var(--ink-fraco); text-transform: uppercase; letter-spacing: .06em; }
.mes .v { font-family: var(--mono); font-weight: 600; font-size: 0.95rem; }
.dica { font-size: 0.84rem; color: var(--ink-suave); border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.dica b { color: var(--ink); }
.estado { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.estado.ok { background: var(--ok-bg); color: var(--ok); }
.estado.alerta { background: var(--alerta-bg); color: var(--alerta); }
.estado.erro { background: var(--erro-bg); color: var(--erro); }

/* Rotina */
.rotina { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .rotina { grid-template-columns: minmax(0, 1fr); } }
.agenda { list-style: none; margin: 0; padding: 0; }

.agenda li.agora { background: var(--surface-alt); }
.agenda li.feito .txt { color: var(--ink-fraco); text-decoration: line-through; }
.agenda input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--azul); margin-top: 2px; }
.agenda .hora { font-family: var(--mono); font-size: 0.8rem; color: var(--azul); padding-top: 1px; }
.lista { margin: 0; padding: 12px 16px 14px 34px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; color: var(--ink-suave); }
.progresso-dia { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--ink-fraco); }
.progresso-dia .barra { width: 120px; }

/* Equipe e regras */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-family: var(--display); font-weight: 600; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 0.8rem; color: var(--ink-fraco); }
.fat { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }

.fat-trilho { position: relative; height: 14px; background: var(--f0); border-radius: 4px; }

.texto { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; color: var(--ink-suave); max-width: 80ch; }
.texto code { font-family: var(--mono); font-size: 0.82rem; background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; color: var(--ink); }

</style>

<script>

  let k = 0;
  FUNCOES.forEach(f => {
    s.pessoas[f.id] = f.pessoas.map(nome => {
      const id = f.id + "-" + (k++);
      const r = ritmo[k % ritmo.length];
      const bases = {}, meses = { out: {}, nov: {}, dez: {} };
      f.ind.forEach(ind => {
        if (ind.tipo === "gradual" && !ind.derivado) bases[ind.id] = baseSugerida(ind);
      });
      if (f.id === "gestor") {
        bases.leadsPct = 70;
        MESES.slice(0, 2).forEach((m, i) => {
          const plan = 36000 + k * 4000;
          meses[m.id] = { copys: +(2 + r[i]).toFixed(1), plan, gasto: Math.round(plan * (0.9 + r[i] * 0.08)), leads: Math.round(plan / 40 * (0.72 + r[i] * 0.3)) };
        });
      } else {
        MESES.slice(0, 2).forEach((m, i) => {
          f.ind.forEach(ind => {
            if (ind.tipo === "corte") meses[m.id][ind.id] = ind.dir === "min" ? +(ind.meta * (r[i] > 0.7 ? 0.8 : 1.3)).toFixed(1) : ind.meta;
            else { const b = bases[ind.id]; meses[m.id][ind.id] = +(b + (ind.meta - b) * r[i]).toFixed(1); }
          });
        });
      }
      s.dados[id] = { nome, bases, meses };
      return id;
    });

}
function baseSugerida(ind) {
  if (ind.dir === "min") return ind.un === "n" ? 4 : ind.meta * 2;
  if (ind.un === "%") return Math.round(ind.meta * 0.65);
  return +(ind.meta * 0.65).toFixed(1);
}

/* ============================================================
   Cálculo
   ============================================================ */
const trava = x => Math.max(0, Math.min(1, x));
const temValor = v => v !== null && v !== undefined && v !== "" && !Number.isNaN(v);

function progresso(ind, v, base, metaMes) {
  if (!temValor(v)) return null;
  const meta = metaMes ?? ind.meta;
  if (ind.tipo === "corte") return (ind.dir === "min" ? v <= meta : v >= meta) ? 1 : 0;
  if (!temValor(base) || !temValor(meta)) return null;
  if (meta === base) return (ind.dir === "min" ? v <= meta : v >= meta) ? 1 : 0;
  return trava((v - base) / (meta - base));
}
function metaSat() { return temValor(S.empresa.satBase) ? Math.min(100, +(S.empresa.satBase * 1.1).toFixed(1)) : null; }
function fatBase(mes) { return mes === "out" ? S.empresa.baseSet : mes === "nov" ? FAT_META.out : FAT_META.nov; }

// valores do mês: fonte = lançado ou simulação
function valorEmpresa(ind, mes, sim) {
  if (sim) return ind.id === "fat" ? sim.fat[mes] : sim[ind.id];
  return S.empresa.meses[mes]?.[ind.id];
}
function progEmpresa(ind, mes, sim) {
  const v = valorEmpresa(ind, mes, sim);
  if (ind.id === "fat") return progresso(ind, v, fatBase(mes), FAT_META[mes]);
  if (ind.id === "sat") return progresso(ind, v, S.empresa.satBase, metaSat());
  return progresso(ind, v, null);
}
function valorPessoa(f, pid, ind, mes, sim) {
  if (sim) return sim[ind.id];
  const m = S.dados[pid].meses[mes] || {};
  return ind.derivado ? ind.derivado(m) : m[ind.id];
}
function progPessoa(f, pid, ind, mes, sim) {
  return progresso(ind, valorPessoa(f, pid, ind, mes, sim), S.dados[pid].bases[ind.id]);
}
function mesLancado(f, pid, mes) {
  const m = S.dados[pid].meses[mes] || {};
  return Object.values(m).some(temValor);
}
// nota do mês = Σ peso × progresso; linha sem valor conta zero
function notaMes(f, pid, mes, sim) {
  let n = 0;
  EMPRESA.forEach(ind => { n += ind.peso * (progEmpresa(ind, mes, sim?.empresa) ?? 0); });
  f.ind.forEach(ind => { n += ind.peso * (progPessoa(f, pid, ind, mes, sim?.pessoa) ?? 0); });
  return n;
}
function resultado(f, pid, sim) {
  const meses = MESES.map(m => ({ id: m.id, nota: (sim || mesLancado(f, pid, m.id)) ? notaMes(f, pid, m.id, sim) : null }));
  const validos = meses.filter(m => m.nota !== null);
  const nota = validos.length ? validos.reduce((a, m) => a + m.nota, 0) / validos.length : null;
  return { meses, nota, lancados: validos.length };
}
function faixa(nota) { return BONUS.find(b => nota >= b.de && nota < b.ate) || BONUS[0]; }
function proxima(nota) { return BONUS.find(b => b.de > nota); }
// maior alavanca: linha com mais pontos na mesa (peso × o que falta)
function alavanca(f, pid, sim) {
  const linhas = [];
  const media = fn => { const ps = MESES.map(m => fn(m.id)).filter(p => p !== null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : 0; };
  f.ind.forEach(ind => { const p = media(mes => progPessoa(f, pid, ind, mes, sim?.pessoa)); linhas.push({ nome: ind.nome, p, falta: ind.peso * (1 - p) }); });
  EMPRESA.forEach(ind => { const p = media(mes => progEmpresa(ind, mes, sim?.empresa)); linhas.push({ nome: ind.nome + " (empresa)", p, falta: ind.peso * (1 - p) }); });
  return linhas.sort((a, b) => b.falta - a.falta)[0];
}

function fmt(v, un) {
  if (!temValor(v)) return "—";
  if (un === "R$") return v >= 1000 ? brl.format(v) : brl2.format(v);
  if (un === "%") return nf1.format(v) + "%";

}

      ${S.pessoas[f.id].length > 1 ? `<button class="btn" data-acao="rem-pessoa">Remover</button>` : ""}
    </div>`;
  if (sub === "rotina") return cab + telaRotina(f, pid);
  return cab + `
    <div class="grade">
      <div class="coluna">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="seg" role="group" aria-label="Modo">
            <button data-modo="lancar" aria-pressed="${modo === "lancar"}">Acompanhar</button>
            <button data-modo="simular" aria-pressed="${modo === "simular"}">Simular</button>
          </div>
          ${modo === "simular" ? `<div class="acoes"><button class="btn" data-sim="lancado">Partir do lançado</button><button class="btn" data-sim="meta">Tudo na meta</button><button class="btn" data-sim="base">Tudo na base</button></div>`
            : `<span class="ind-fonte">Salvo neste navegador.</span>`}
        </div>
        ${modo === "simular" ? tabelaSim(f, pid) : tabelaLancar(f, pid)}
      </div>
      <aside class="placar${modo === "simular" ? " sim" : ""}" id="placar" aria-live="polite"></aside>
    </div>`;
}

function celulaProg(p, peso, idp) {
  if (p === null) return `<td class="d" id="${idp}-p"><span class="vazio">—</span></td><td class="d" id="${idp}-n"><span class="vazio">—</span></td>`;
  return `<td class="d" id="${idp}-p"><div class="prog"><span class="barra"><i class="${p >= 1 ? "cheio" : ""}" style="width:${p * 100}%"></i></span><span class="num">${Math.round(p * 100)}%</span></div></td>
    <td class="d" id="${idp}-n"><span class="pts">${nf2.format(p * peso)}</span></td>`;
}
function mediaProg(fn) { const ps = MESES.map(m => fn(m.id)).filter(p => p !== null); return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null; }

function tabelaLancar(f, pid) {
  const d = S.dados[pid];
  const inp = (id, val, extra = "") => `<input class="cel" inputmode="decimal" id="${id}" value="${temValor(val) ? val : ""}" ${extra}>`;
  const head = `<thead><tr><th>Indicador</th><th class="d">Peso</th><th class="d">Meta</th><th class="d">Base</th>${MESES.map(m => `<th class="d">${m.curto}</th>`).join("")}<th class="d">Progresso</th><th class="d">Pontos</th></tr></thead>`;

  // empresa
  let emp = "";
  EMPRESA.forEach(ind => {
    let meta, base;
    if (ind.id === "fat") { meta = `<span class="num">130 · 150 · 200 mil</span>`; base = inp("emp-baseSet", S.empresa.baseSet, 'data-emp-base="baseSet" aria-label="Faturamento de setembro"'); }
    else if (ind.id === "sat") { meta = `<span class="num" id="meta-sat">${fmt(metaSat(), "%")}</span>`; base = inp("emp-satBase", S.empresa.satBase, 'data-emp-base="satBase" aria-label="Satisfação base"'); }
    else { meta = `<span class="num">${fmtMeta(ind)}</span>`; base = `<span class="tag corte">corte</span>`; }
    const cels = MESES.map(m => `<td class="d">${inp(`emp-${ind.id}-${m.id}`, S.empresa.meses[m.id]?.[ind.id], `data-emp="${ind.id}" data-mes="${m.id}" aria-label="${esc(ind.nome)} ${m.nome}"`)}</td>`).join("");
    emp += `<tr><td><div class="ind-nome">${esc(ind.nome)}</div><div class="ind-fonte">${esc(ind.fonte)}</div></td>
      <td class="d num">${nf1.format(ind.peso)}</td><td class="d">${meta}</td><td class="d">${base}</td>${cels}
      ${celulaProg(mediaProg(mes => progEmpresa(ind, mes)), ind.peso, "emp-" + ind.id)}</tr>`;
  });

  // função
  let fun = "";
  if (f.entradas) {
    f.entradas.forEach(e => {
      fun += `<tr class="entrada"><td><div class="ind-nome">${esc(e.nome)}</div></td><td></td><td></td><td class="d"><span class="ind-fonte">lançar</span></td>
        ${MESES.map(m => `<td class="d">${inp(`in-${pid}-${e.id}-${m.id}`, d.meses[m.id]?.[e.id], `data-in="${e.id}" data-mes="${m.id}" aria-label="${esc(e.nome)} ${m.nome}"`)}</td>`).join("")}<td></td><td></td></tr>`;
    });
  }
  f.ind.forEach(ind => {
    const base = ind.tipo === "corte" ? `<span class="tag corte">corte</span>` : inp(`base-${pid}-${ind.id}`, d.bases[ind.id], `data-base="${ind.id}" aria-label="Base ${esc(ind.nome)}"`);
    const cels = MESES.map(m => {
      if (ind.derivado) return `<td class="d num" id="der-${ind.id}-${m.id}">${fmt(valorPessoa(f, pid, ind, m.id), ind.un)}</td>`;
      return `<td class="d">${inp(`v-${pid}-${ind.id}-${m.id}`, d.meses[m.id]?.[ind.id], `data-ind="${ind.id}" data-mes="${m.id}" aria-label="${esc(ind.nome)} ${m.nome}"`)}</td>`;
    }).join("");
    fun += `<tr><td><div class="ind-nome">${esc(ind.nome)}${ind.tipo === "corte" ? '<span class="tag corte">corte</span>' : ""}</div><div class="ind-fonte">${esc(ind.fonte)}</div></td>
      <td class="d num">${nf1.format(ind.peso)}</td><td class="d num">${fmtMeta(ind)}</td><td class="d">${base}</td>${cels}
      ${celulaProg(mediaProg(mes => progPessoa(f, pid, ind, mes)), ind.peso, "ind-" + ind.id)}</tr>`;
  });

  return `
    <section class="bloco"><div class="bloco-cab"><h2>Meta individual · ${esc(f.nome)}</h2><span class="peso-total">peso 7</span></div>
      <div class="rolagem"><table class="ct">${head}<tbody>${fun}</tbody></table></div></section>
    <section class="bloco"><div class="bloco-cab"><h2>Metas da empresa</h2><span class="peso-total">peso 3 · iguais para todos</span></div>
      <div class="rolagem"><table class="ct">${head}<tbody>${emp}</tbody></table></div></section>`;
}

/* ---------- Simulação ---------- */
function faixaSlider(ind) {
  if (ind.id === "fat") return [80000, 230000, 500];
  if (ind.un === "%") return [0, 100, 0.5];
  if (ind.un === "dias") return [0, 30, 0.5];
  if (ind.un === "R$") return [15, 90, 0.5];
  if (ind.dir === "min") return [0, 12, 1];
  return [0, Math.ceil(ind.meta * 1.6), 0.1];
}
function simAtual(f, pid) {
  const k = pid;
  if (!S.sim[k]) S.sim[k] = simDe(f, pid, "lancado");
  return S.sim[k];
}
function simDe(f, pid, tipo) {
  const d = S.dados[pid];
  const media = fn => { const vs = MESES.map(m => fn(m.id)).filter(temValor); return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null; };
  const pessoa = {}, empresa = { fat: {} };
  f.ind.forEach(ind => {
    const base = ind.tipo === "corte" ? (ind.dir === "min" ? ind.meta * 1.5 : 0) : d.bases[ind.id];
    if (tipo === "meta") pessoa[ind.id] = ind.meta;
    else if (tipo === "base") pessoa[ind.id] = temValor(base) ? base : faixaSlider(ind)[0];
    else { const v = media(mes => valorPessoa(f, pid, ind, mes)); pessoa[ind.id] = temValor(v) ? +v.toFixed(1) : (temValor(base) ? base : ind.meta); }
  });
  EMPRESA.forEach(ind => {
    if (ind.id === "fat") MESES.forEach(m => {
      const lanc = S.empresa.meses[m.id]?.fat;
      empresa.fat[m.id] = tipo === "meta" ? FAT_META[m.id] : tipo === "base" ? (fatBase(m.id) ?? 100000) : (temValor(lanc) ? lanc : FAT_META[m.id] * 0.9);
    });
    else {
      const meta = ind.id === "sat" ? (metaSat() ?? 75) : ind.meta;
      const base = ind.id === "sat" ? (S.empresa.satBase ?? 60) : ind.meta * 1.5;
      const v = media(mes => S.empresa.meses[mes]?.[ind.id]);
      empresa[ind.id] = tipo === "meta" ? meta : tipo === "base" ? base : (temValor(v) ? +v.toFixed(1) : meta);
    }
  });
  return { pessoa, empresa };
}
function slider(id, ind, v, attrs) {
  const [mn, mx, st] = faixaSlider(ind);
  return `<div class="sim-cel"><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}" ${attrs} aria-label="${esc(ind.nome)}"><output id="${id}-o">${fmt(v, ind.un)}</output></div>`;
}
function tabelaSim(f, pid) {
  const sim = simAtual(f, pid);
  const head = `<thead><tr><th>Indicador</th><th class="d">Peso</th><th class="d">Meta</th><th>Valor simulado</th><th class="d">Progresso</th><th class="d">Pontos</th></tr></thead>`;
  let fun = "";
  f.ind.forEach(ind => {
    const p = progresso(ind, sim.pessoa[ind.id], S.dados[pid].bases[ind.id]);
    fun += `<tr><td><div class="ind-nome">${esc(ind.nome)}${ind.tipo === "corte" ? '<span class="tag corte">corte</span>' : ""}</div><div class="ind-fonte">${ind.tipo === "corte" ? "dentro do limite vale o peso inteiro" : "base " + fmt(S.dados[pid].bases[ind.id], ind.un)}</div></td>
      <td class="d num">${nf1.format(ind.peso)}</td><td class="d num">${fmtMeta(ind)}</td>
      <td>${slider(`s-${ind.id}`, ind, sim.pessoa[ind.id], `data-s="${ind.id}"`)}</td>${celulaProg(p, ind.peso, "sind-" + ind.id)}</tr>`;
  });
  let emp = "";
  EMPRESA.forEach(ind => {
    if (ind.id === "fat") {
      MESES.forEach(m => {
        const p = progresso(ind, sim.empresa.fat[m.id], fatBase(m.id), FAT_META[m.id]);
        emp += `<tr><td><div class="ind-nome">Faturamento · ${m.nome}</div><div class="ind-fonte">base ${fmt(fatBase(m.id), "R$")}</div></td>
          <td class="d num">${nf1.format(ind.peso)}<span class="ind-fonte"> ÷3</span></td><td class="d num">${fmt(FAT_META[m.id], "R$")}</td>
          <td>${slider(`s-fat-${m.id}`, ind, sim.empresa.fat[m.id], `data-sfat="${m.id}"`)}</td>${celulaProg(p, ind.peso / 3, "sfat-" + m.id)}</tr>`;
      });
    } else {
      const p = ind.id === "sat" ? progresso(ind, sim.empresa.sat, S.empresa.satBase, metaSat()) : progresso(ind, sim.empresa[ind.id], null);
      emp += `<tr><td><div class="ind-nome">${esc(ind.nome)}${ind.tipo === "corte" ? '<span class="tag corte">corte</span>' : ""}</div><div class="ind-fonte">${esc(ind.fonte)}</div></td>
        <td class="d num">${nf1.format(ind.peso)}</td><td class="d num">${ind.id === "sat" ? fmt(metaSat(), "%") : fmtMeta(ind)}</td>
        <td>${slider(`s-e-${ind.id}`, ind, sim.empresa[ind.id], `data-se="${ind.id}"`)}</td>${celulaProg(p, ind.peso, "se-" + ind.id)}</tr>`;
    }
  });
  return `
    <p class="ind-fonte">A simulação não mexe no que foi lançado. Cada valor vale para os três meses; o faturamento tem um valor por mês porque a meta sobe.</p>
    <section class="bloco"><div class="bloco-cab"><h2>Meta individual · ${esc(f.nome)}</h2><span class="peso-total">peso 7</span></div>
      <div class="rolagem"><table class="ct" style="min-width:680px">${head}<tbody>${fun}</tbody></table></div></section>
    <section class="bloco"><div class="bloco-cab"><h2>Metas da empresa</h2><span class="peso-total">peso 3</span></div>
      <div class="rolagem"><table class="ct" style="min-width:680px">${head}<tbody>${emp}</tbody></table></div></section>`;
}

/* ---------- Placar ---------- */
function atualizarPlacar() {
  const f = FUNCOES.find(x => x.id === S.aba);
  const el = document.getElementById("placar"); if (!f || !el) return;
  const pid = pessoaAtual(f);
  const simulando = (S.modo[f.id] || "lancar") === "simular";
  const sim = simulando ? simAtual(f, pid) : null;
  const r = resultado(f, pid, sim);
  const nota = r.nota;
  const fx = nota === null ? null : faixa(nota);
  const prox = nota === null ? null : proxima(nota);
  const cores = ["var(--f0)", "var(--f1)", "var(--f2)", "var(--f3)", "var(--f4)"];
  const faixasHtml = BONUS.map((b, i) => `<span style="width:${(Math.min(b.ate, 10) - b.de) * 10}%;background:${cores[i]}" title="${b.de} a ${Math.min(b.ate, 10)}: ${brl.format(b.valor)}"></span>`).join("");
  const alav = alavanca(f, pid, sim);
  let dica = "";
  if (nota !== null) {
    dica = prox ? `<span>Faltam <b>${nf2.format(prox.de - nota)} ponto${prox.de - nota >= 1.995 ? "s" : ""}</b> para ${brl.format(prox.valor)}.</span>` : `<span><b>Faixa máxima.</b></span>`;
    if (alav && alav.falta > 0.01) dica += `<span>Maior alavanca: <b>${esc(alav.nome)}</b>, com ${nf2.format(alav.falta)} ponto${alav.falta >= 1.995 ? "s" : ""} ainda na mesa.</span>`;
    if (!simulando && r.lancados < 3) dica += `<span class="ind-fonte">Parcial: ${r.lancados} de 3 meses lançados.</span>`;
  }
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span class="rotulo">${simulando ? "Simulação" : "Nota do trimestre"}</span>
      ${nota === null ? '<span class="estado alerta">sem lançamento</span>' : fx.valor ? '<span class="estado ok">com bônus</span>' : '<span class="estado erro">abaixo de 6</span>'}
    </div>
    <div class="nota-grande"><span class="n" id="nota-n">${nota === null ? "—" : nf1.format(nota)}</span><span class="de">/ 10</span></div>
    <div><span class="rotulo">Bônus</span><div class="bonus">${fx ? brl.format(fx.valor) : "—"}</div></div>
    <div class="regua"><div class="faixas">${faixasHtml}</div>${nota !== null ? `<span class="marcador" style="left:${Math.min(nota, 10) * 10}%"></span>` : ""}
      <div class="regua-rot"><span>0</span><span style="margin-left:52%">6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>
    <div class="meses">${r.meses.map((m, i) => `<div class="mes"><span class="m">${MESES[i].curto}</span><span class="v">${m.nota === null ? "—" : nf1.format(m.nota)}</span></div>`).join("")}</div>
    ${dica ? `<div class="dica">${dica}</div>` : ""}`;
}

/* ---------- Rotina ---------- */
const hoje = () => new Date().toISOString().slice(0, 10);
function minutos(hhmm) { const m = /^(\d{2}):(\d{2})/.exec(hhmm); return m ? +m[1] * 60 + +m[2] : null; }
function telaRotina(f, pid) {
  const r = ROTINAS[f.id];
  const dia = hoje();
  const marc = (S.checks[pid] || {})[dia] || {};
  const agora = new Date(); const min = agora.getHours() * 60 + agora.getMinutes();
  const feitos = r.agenda.filter((_, i) => marc[i]).length;
  const itens = r.agenda.map(([h, t], i) => {
    const ini = minutos(h), fim = minutos(h.split("–")[1]?.trim() || "");
    const ativo = ini !== null && fim !== null && min >= ini && min < fim;
    return `<li class="${marc[i] ? "feito" : ""}${ativo ? " agora" : ""}"><input type="checkbox" id="chk-${pid}-${i}" data-chk="${i}" ${marc[i] ? "checked" : ""}>
      <label class="hora" for="chk-${pid}-${i}">${esc(h)}</label><span class="txt">${esc(t)}</span></li>`;
  }).join("");
  const dataBr = new Date(dia + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  return `
    ${r.pendente ? `<div class="aviso"><span>${esc(r.pendente)}</span></div>` : ""}
    <div class="rotina">
      <section class="bloco">
        <div class="bloco-cab"><h2>Agenda de ${esc(dataBr)}</h2>
          <span class="progresso-dia"><span class="barra"><i class="${feitos === r.agenda.length ? "cheio" : ""}" style="width:${feitos / r.agenda.length * 100}%"></i></span><span class="num">${feitos}/${r.agenda.length}</span></span></div>
        <ul class="agenda">${itens}</ul>
      </section>
      <div class="coluna">
        <section class="bloco"><div class="bloco-cab"><h2>Regras da rotina</h2></div><ul class="lista">${r.regras.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
        <section class="bloco"><div class="bloco-cab"><h2>Na revisão de sexta</h2></div><ul class="lista">${r.sexta.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>
        <section class="bloco"><div class="bloco-cab"><h2>Daily às 09:30</h2></div>
          <p class="texto">Só exceções, até 3 minutos por pessoa, na ordem TI → gestores → social media → design → CS. O que não se resolve em 1 minuto vai para o bloco de impedimentos das 09:50.</p></section>
      </div>
    </div>`;
}

/* ---------- Regras ---------- */
function telaRegras() {
  const tab = BONUS.map(b => `<tr><td class="num">${b.de === 0 ? "abaixo de 6" : b.ate > 10 ? "9 ou mais" : `${b.de} a ${b.ate}`}</td><td class="d num">${brl.format(b.valor)}</td></tr>`).join("");
  return `
    <div class="cab-funcao"><div><h1>Regras do contrato</h1><p class="sub">O que vale para todas as funções no quarto trimestre de 2026.</p></div></div>
    <div class="grade" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <section class="bloco"><div class="bloco-cab"><h2>Como a nota é feita</h2></div><div class="texto">
        <p>Cada linha tem peso. Os pesos somam 10: <b>3 da empresa</b>, iguais para todos, e <b>7 da função</b>.</p>
        <p><b>Linha gradual:</b> progresso = (realizado − base) ÷ (meta − base), travado entre 0% e 100%. Funciona também quando menor é melhor, com a meta abaixo da base.</p>
        <p><b>Linha de corte</b> (metas "até X"): dentro do limite vale o peso inteiro; fora, zero.</p>
        <p>Pontos da linha = progresso × peso. <b>Nota do mês</b> = soma dos pontos. <b>Nota do trimestre</b> = média das notas de outubro, novembro e dezembro.</p>
        <p><b>Faturamento:</b> cada mês parte da meta do mês anterior. Outubro vai de setembro a R$ 130 mil, novembro de 130 a 150 mil e dezembro de 150 a 200 mil.</p>
        <p><b>Gestor:</b> lead é conversa iniciada no WhatsApp ou lead de formulário, os dois contam igual. Meta de leads = investimento planejado ÷ 40; CPL = investimento gasto ÷ leads, com limite de R$ 40 em todas as contas. No contrato, soma-se a carteira inteira, sem média por cliente.</p>
      </div></section>
      <div class="coluna">
        <section class="bloco"><div class="bloco-cab"><h2>Bônus do trimestre</h2><span class="peso-total">limite de baixo incluso</span></div>
          <table class="ct" style="min-width:0"><thead><tr><th>Nota</th><th class="d">Valor</th></tr></thead><tbody>${tab}</tbody></table></section>
        <section class="bloco"><div class="bloco-cab"><h2>Ainda pendente</h2></div><ul class="lista">
          <li>Links das planilhas de verba por cliente e do faturamento, para os números entrarem sozinhos.</li>
          <li>Leads de formulário: a extração do Stract só traz conversas do WhatsApp. Campanhas de formulário somaram R$ 50,3 mil em setembro sem os leads delas.</li>
          <li>Design: os 6 por dia são criativos no total ou só vídeos.</li>
          <li>Rotina do gestor de tráfego.</li>
        </ul></section>
        <section class="bloco"><div class="bloco-cab"><h2>Dados deste painel</h2></div><div class="texto">
          <p>Os lançamentos ficam salvos só neste navegador. Outra pessoa que abrir o link não vê o que você digitou.</p>
          <div class="acoes"><button class="btn" data-acao="exemplo">Recarregar exemplo</button><button class="btn" data-acao="limpar">Apagar tudo e começar em branco</button></div>
          <p id="confirma" class="ind-fonte" hidden></p>
        </div></section>
      </div>
    </div>`;
}

/* ============================================================
   Eventos
   ============================================================ */
const palco = document.getElementById("palco");
let confirmar = null;
palco.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const f = FUNCOES.find(x => x.id === S.aba);
  if (t.dataset.ir) { S.aba = t.dataset.ir; S.pessoaSel[t.dataset.ir] = t.dataset.pid; salvar(); desenhar(); window.scrollTo(0, 0); return; }
  if (t.dataset.pessoa) { S.pessoaSel[f.id] = t.dataset.pessoa; salvar(); desenhar(); return; }
  if (t.dataset.sub) { S.sub[f.id] = t.dataset.sub; salvar(); desenhar(); return; }
  if (t.dataset.modo) { S.modo[f.id] = t.dataset.modo; salvar(); desenhar(); return; }
  if (t.dataset.sim) { const pid = pessoaAtual(f); S.sim[pid] = simDe(f, pid, t.dataset.sim); salvar(); desenhar(); return; }
  const acao = t.dataset.acao;
  if (acao === "add-pessoa") {
    const id = f.id + "-" + Date.now().toString(36);
    S.dados[id] = { nome: "Nova pessoa", bases: {}, meses: { out: {}, nov: {}, dez: {} } };
    f.ind.forEach(ind => { if (ind.tipo === "gradual") S.dados[id].bases[ind.id] = baseSugerida(ind); });
    if (f.id === "gestor") S.dados[id].bases.leadsPct = 70;
    S.pessoas[f.id].push(id); S.pessoaSel[f.id] = id; salvar(); desenhar();
    document.getElementById("nome-" + id)?.select();
  }
  if (acao === "rem-pessoa") {
    const pid = pessoaAtual(f);
    if (confirmar !== "rem-" + pid) { confirmar = "rem-" + pid; t.textContent = "Clique de novo para remover " + S.dados[pid].nome; return; }
    S.pessoas[f.id] = S.pessoas[f.id].filter(p => p !== pid); delete S.dados[pid]; confirmar = null; salvar(); desenhar();
  }
  if (acao === "limpar" || acao === "exemplo") {
    if (!S.exemplo && confirmar !== acao) { confirmar = acao; t.textContent = "Clique de novo para confirmar"; return; }
    const aba = S.aba; S = acao === "limpar" ? vazio() : exemplo(); S.aba = aba; confirmar = null; salvar(); desenhar();
  }
});

palco.addEventListener("input", e => {
  const el = e.target;
  const f = FUNCOES.find(x => x.id === S.aba);
  if (el.dataset.nome) { S.dados[el.dataset.nome].nome = el.value || "Sem nome"; salvar(); document.querySelector(`[data-pessoa="${el.dataset.nome}"]`).textContent = S.dados[el.dataset.nome].nome; return; }
  if (el.dataset.chk !== undefined) {
    const pid = pessoaAtual(f); const dia = hoje();
    S.checks[pid] = S.checks[pid] || {}; S.checks[pid][dia] = S.checks[pid][dia] || {};
    S.checks[pid][dia][el.dataset.chk] = el.checked; salvar(); desenhar(); return;
  }
  // simulação
  if (el.type === "range") {
    const pid = pessoaAtual(f); const sim = simAtual(f, pid); const v = Number(el.value);
    if (el.dataset.s) sim.pessoa[el.dataset.s] = v;
    if (el.dataset.sfat) sim.empresa.fat[el.dataset.sfat] = v;
    if (el.dataset.se) sim.empresa[el.dataset.se] = v;
    salvar(); atualizarLinhasSim(f, pid); atualizarPlacar(); return;
  }
  // lançamento
  const v = lerNum(el);
  if (v !== null && Number.isNaN(v)) { el.classList.add("fora"); return; }
  el.classList.remove("fora");
  if (S.exemplo) S.exemplo = false;
  if (el.dataset.empBase) S.empresa[el.dataset.empBase] = v;
  else if (el.dataset.emp) { S.empresa.meses[el.dataset.mes] = S.empresa.meses[el.dataset.mes] || {}; S.empresa.meses[el.dataset.mes][el.dataset.emp] = v; }
  else if (f) {
    const pid = pessoaAtual(f); const d = S.dados[pid];
    if (el.dataset.base) d.bases[el.dataset.base] = v;
    else { const k = el.dataset.in || el.dataset.ind; d.meses[el.dataset.mes] = d.meses[el.dataset.mes] || {}; d.meses[el.dataset.mes][k] = v; }
  }
  salvar(); atualizarLinhasLancar(f);
});

function trocarProg(idp, p, peso) {
  const a = document.getElementById(idp + "-p"), b = document.getElementById(idp + "-n"); if (!a || !b) return;
  const tmp = document.createElement("tr"); tmp.innerHTML = celulaProg(p, peso, idp);
  a.replaceWith(tmp.children[0]); b.replaceWith(tmp.children[0]);
}
function atualizarLinhasLancar(f) {
  if (!f) return;
  const pid = pessoaAtual(f);
  EMPRESA.forEach(ind => trocarProg("emp-" + ind.id, mediaProg(mes => progEmpresa(ind, mes)), ind.peso));
  const ms = document.getElementById("meta-sat"); if (ms) ms.textContent = fmt(metaSat(), "%");
  f.ind.forEach(ind => {
    if (ind.derivado) MESES.forEach(m => { const c = document.getElementById(`der-${ind.id}-${m.id}`); if (c) c.textContent = fmt(valorPessoa(f, pid, ind, m.id), ind.un); });
    trocarProg("ind-" + ind.id, mediaProg(mes => progPessoa(f, pid, ind, mes)), ind.peso);
  });
  document.querySelector(".aviso")?.remove();
  atualizarPlacar();
}
function atualizarLinhasSim(f, pid) {
  const sim = simAtual(f, pid);
  f.ind.forEach(ind => {
    document.getElementById(`s-${ind.id}-o`).textContent = fmt(sim.pessoa[ind.id], ind.un);
    trocarProg("sind-" + ind.id, progresso(ind, sim.pessoa[ind.id], S.dados[pid].bases[ind.id]), ind.peso);
  });
  MESES.forEach(m => {
    document.getElementById(`s-fat-${m.id}-o`).textContent = fmt(sim.empresa.fat[m.id], "R$");
    trocarProg("sfat-" + m.id, progresso(EMPRESA[0], sim.empresa.fat[m.id], fatBase(m.id), FAT_META[m.id]), EMPRESA[0].peso / 3);
  });
  EMPRESA.slice(1).forEach(ind => {
    document.getElementById(`s-e-${ind.id}-o`).textContent = fmt(sim.empresa[ind.id], ind.un);
    const p = ind.id === "sat" ? progresso(ind, sim.empresa.sat, S.empresa.satBase, metaSat()) : progresso(ind, sim.empresa[ind.id], null);
    trocarProg("se-" + ind.id, p, ind.peso);
  });
}

desenhar();
</script>
